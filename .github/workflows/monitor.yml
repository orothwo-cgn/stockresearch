# Aktienresearch-Monitor in GitHub Actions: einziger "Läufer" (Telegram, gemeinsamer Meldestand).
# Takt kommt seit 28.10.2026 von außen (cron-job.org ruft workflow_dispatch auf), weil GitHub die eigenen
# Zeitpläne stark verzögert oder auslässt (z. B. 6 statt 60 Läufe am 27.10.2026). Plan bei cron-job.org,
# immer Modus voll (dauert nur ca. 1 Minute und prüft auch Kaufzonen und Einzelwerte), Mo-Fr:
#   Job "US-Start":   9:40 Uhr America/New_York (10 Min. nach Börsenstart)
#   Job "US-Handel":  10:10 bis 16:40 Uhr America/New_York, Minute 10 und 40 (alle 30 Min., letzter nach Schluss)
#   Job "Europa":     9:30, 11:30 und 13:30 Uhr Europe/Berlin
# Zeitzone je Job bei cron-job.org einstellen, dann stimmt die Sommerzeit von selbst.
# Die Zeitpläne unten sind nur noch Absicherung, falls cron-job.org ausfällt (UTC, Winterzeit-Werte).
name: Monitor

on:
  schedule:
    - cron: "45 7 * * 1-5"        # Absicherung: voller Lauf morgens (8:45 Uhr Winterzeit)
    - cron: "5 15 * * 1-5"        # Absicherung: voller Lauf nach US-Börsenstart
    - cron: "40 21 * * 1-5"       # Absicherung: voller Lauf nach US-Börsenschluss
  workflow_dispatch:
    inputs:
      modus:
        description: "schnell oder voll"
        required: true
        default: "voll"
        type: choice
        options: [schnell, voll, telegramtest]

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AKTIEN_LAEUFER: "1"
      TZ: Europe/Berlin
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || vars.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete
        run: pip install -q -r requirements.txt

      - name: Monitor
        run: |
          MODUS="schnell"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODUS="${{ inputs.modus }}"; fi
          case "${{ github.event.schedule }}" in
            "45 7 * * 1-5"|"5 15 * * 1-5"|"40 21 * * 1-5") MODUS="voll" ;;
          esac
          echo "Modus: $MODUS"
          if [ "$MODUS" = "telegramtest" ]; then python telegram.py "Test von GitHub Actions: Der Monitor kann dir Nachrichten schicken."; exit 0; fi
          if [ "$MODUS" = "voll" ]; then python monitor.py --telegram; else python monitor.py --schnell --telegram; fi

      - name: Stand speichern
        run: |
          git config user.name "aktien-monitor"
          git config user.email "aktien-monitor@users.noreply.github.com"
          git add state.json kurs_cache.json dashboard.html reports/daten.json reports/latest.json reports/latest_schnell.json reports/fear_greed.json reports/kurz.md reports/20*.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "nichts zu speichern"; exit 0; fi
          git commit -q -m "Monitor-Lauf $(date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && exit 0
            sleep 5
          done
          echo "Push fehlgeschlagen"; exit 1
